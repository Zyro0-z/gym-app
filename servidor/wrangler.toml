# Servidor opcional de copias cifradas (ver servidor/README.md). El nombre se mantiene para no cambiar la URL ya desplegada.
name = "gym-avisos"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ORIGEN = "https://zyro0-z.github.io"

# Crea el espacio con «npx wrangler kv namespace create COPIAS», descomenta este bloque y pega su id.
# [[kv_namespaces]]
# binding = "COPIAS"
# id = "PEGA_AQUI_EL_ID_DEL_KV"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Avisos"]

[[migrations]]
tag = "v2"
deleted_classes = ["Avisos"]
