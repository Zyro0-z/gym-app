<!doctype html>
<html lang="es" data-theme="light" data-accent="azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="src/ui/tokens.css">
<link rel="stylesheet" href="src/ui/base.css">
<link rel="stylesheet" href="src/ui/componentes.css">
<title>Gym</title>
<script>/* tema y acento antes del primer pintado, sin parpadeo */
(function () { var p = {}; try { p = JSON.parse(localStorage.getItem("gym-apariencia") || "{}"); } catch (e) {}
  var t = p.tema || "auto", o = t === "oscuro" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  var r = document.documentElement; r.dataset.theme = o ? "dark" : "light"; r.dataset.accent = p.acento || "azul";
  document.querySelector('meta[name="theme-color"]').content = o ? "#000000" : "#F2F2F7"; })();</script>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<noscript>Esta app necesita JavaScript.</noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
